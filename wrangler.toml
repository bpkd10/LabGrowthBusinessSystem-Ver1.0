# Cloudflare Workers config สำหรับ deploy public link (ADR-001 ข้อ 5.2)
#
# Worker ตัวนี้ทำหน้าที่แค่ 2 อย่าง: เสิร์ฟไฟล์ static และส่ง security header
# ไม่มี secret, ไม่มี env binding ใด ๆ โดยเจตนา — ถ้าวันหนึ่งมีคนเพิ่ม
# OPENAI_API_KEY หรือ [vars] กลับเข้ามาในไฟล์นี้ แปลว่าการตัดสินใจใน ADR-001
# ถูกย้อน ต้องกลับไปแก้เอกสารก่อน
#
# ตรวจกับเอกสาร Cloudflare แล้ว (https://developers.cloudflare.com/workers/wrangler/configuration/):
# name, main, compatibility_date เป็น field ที่จำเป็นขั้นต่ำในการ deploy Worker
# workers_dev เป็น field ที่ไม่บังคับ ค่า default อยู่แล้วคือ true — ใส่ไว้ตรง ๆ
# เพื่อให้อ่านง่ายว่าตั้งใจให้ใช้ *.workers.dev subdomain

# ชื่อนี้กลายเป็น subdomain ของ URL สาธารณะ: utai-business-growth-system.<บัญชี>.workers.dev
#
# ตั้งใจไม่ประกาศ routes หรือ custom_domain ไว้ในไฟล์นี้ เพราะ uncletungai.site และ
# www.uncletungai.site เป็นเว็บธุรกิจจริงที่ให้บริการอยู่บน Netlify การใส่ route ครอบ
# โดเมนนั้นจะทำให้ Worker ดัก traffic ของเว็บจริงทั้งหมดทันทีที่ deploy
# scripts/check-deploy-target.mjs บังคับกฎนี้ไว้แล้ว ถ้าจะผูกโดเมนเองให้ใช้ subdomain
# ที่ยังว่าง เช่น crm.uncletungai.site แล้วรัน npm run check ก่อนเสมอ
name = "utai-business-growth-system"
main = "dist/server/index.js"

# ต้องรันคำสั่ง `npm run build` ก่อนเสมอ เพื่อสร้างไฟล์ dist/server/index.js
# จาก scripts/build.mjs — ไฟล์นี้ไม่ได้ถูก commit เข้า repo (อยู่ใน .gitignore)

# ยืนยันกับ Wrangler เวอร์ชันที่ใช้จริงตอน deploy อีกครั้ง (ADR-001 ข้อ 10.4)
compatibility_date = "2026-08-08"

workers_dev = true

# โดเมนสาธารณะของระบบนี้
#
# custom_domain = true สั่งให้ Wrangler สร้าง DNS record ใหม่ชื่อ crm ใน zone
# uncletungai.site แล้วออกใบรับรองให้ เป็นการ "เพิ่ม" record ไม่ใช่แก้ของเดิม
# record ของ apex (@ ชี้ไป Netlify 75.2.60.5) และ www จึงไม่ถูกแตะต้อง
# เว็บธุรกิจที่ uncletungai.site และ www.uncletungai.site ยังทำงานตามปกติ
#
# ก่อนหน้านี้ตรวจแล้วว่า crm.uncletungai.site ยังไม่มี DNS record ใด ๆ อยู่
# ถ้าจะเปลี่ยนไปใช้ชื่ออื่น ให้ตรวจว่ายังว่างก่อนด้วย `dig +short <ชื่อ>.uncletungai.site`
# และห้ามใส่ apex หรือ www ลงไปเด็ดขาด — scripts/check-deploy-target.mjs จะหยุดให้
routes = [
  { pattern = "crm.uncletungai.site", custom_domain = true }
]
